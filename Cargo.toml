[workspace]
members = [".", "app"]
default-members = ["."]
resolver = "3"

[workspace.package]
version = "0.4.6"
edition = "2024"
license = "MIT"
repository = "https://github.com/acm363/branchsight"
authors = ["Acm_363"]

[package]
name = "branchsight"
description = "Compact git commit graph with a branch picker, served to your browser or shown in a desktop app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
serde_json = "1"
tiny_http = "0.12"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
opt-level = 3
strip = true
lto = "thin"
